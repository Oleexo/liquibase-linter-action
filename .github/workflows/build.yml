name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and linting
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test action (no changelogs)
        id: test-no-violations
        uses: ./
        with:
          directory: test/fixtures/no-violations
          github-token: ${{ secrets.GITHUB_TOKEN }}
          annotate: 'false'
        continue-on-error: true

      - name: Verify no violations
        shell: bash
        run: |
          if [ "${{ steps.test-no-violations.outputs.violations-found }}" != "false" ]; then
            echo "Expected no violations but found some"
            exit 1
          fi
