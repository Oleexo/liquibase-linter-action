name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format-check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Compare dist/
        shell: bash
        run: |
          if ! git diff --quiet --ignore-space-at-eol dist/; then
            echo "Detected uncommitted changes after build. See status below:"
            git diff --ignore-space-at-eol dist/
            exit 1
          fi
        id: diff

      - name: Upload dist
        if: failure() && steps.diff.conclusion == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test action (no changelogs)
        id: test-no-violations
        uses: ./
        with:
          directory: test/fixtures/no-violations
          github-token: ${{ secrets.GITHUB_TOKEN }}
          annotate: 'false'
        continue-on-error: true

      - name: Verify no violations
        shell: bash
        run: |
          if [ "${{ steps.test-no-violations.outputs.violations-found }}" != "false" ]; then
            echo "Expected no violations but found some"
            exit 1
          fi
