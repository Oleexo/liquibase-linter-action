name: Release
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      
      - run: pnpm install --frozen-lockfile
      
      - run: pnpm check
      
      - run: pnpm build
      
      - run: pnpm test
      
      - uses: int128/release-typescript-action@v1
        with:
          major-version: 2
