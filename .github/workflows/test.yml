name: Integration Test

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test-action:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create test changelog with violations
        shell: bash
        run: |
          mkdir -p test/fixtures/with-violations
          cat > test/fixtures/with-violations/changelog.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <databaseChangeLog
              xmlns="http://www.liquibase.org/xml/ns/dbchangelog"
              xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
              xsi:schemaLocation="http://www.liquibase.org/xml/ns/dbchangelog
                  http://www.liquibase.org/xml/ns/dbchangelog/dbchangelog-4.0.xsd">

              <changeSet id="1" author="test">
                  <sql>
                      CREATE TABLE users (
                          id INT PRIMARY KEY,
                          username VARCHAR(50),
                          password VARCHAR(100)
                      );
                  </sql>
              </changeSet>

              <changeSet id="2" author="test">
                  <sql>
                      INSERT INTO users VALUES (1, 'admin', 'hardcoded_password_123');
                  </sql>
              </changeSet>

              <changeSet id="3" author="test">
                  <sql>
                      DROP TABLE old_table;
                  </sql>
              </changeSet>

          </databaseChangeLog>
          EOF

      - name: Create test changelog without violations
        shell: bash
        run: |
          mkdir -p test/fixtures/no-violations
          cat > test/fixtures/no-violations/changelog.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <databaseChangeLog
              xmlns="http://www.liquibase.org/xml/ns/dbchangelog"
              xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
              xsi:schemaLocation="http://www.liquibase.org/xml/ns/dbchangelog
                  http://www.liquibase.org/xml/ns/dbchangelog/dbchangelog-4.0.xsd">

              <changeSet id="1" author="test">
                  <createTable tableName="users">
                      <column name="id" type="int">
                          <constraints primaryKey="true" nullable="false"/>
                      </column>
                      <column name="username" type="varchar(50)">
                          <constraints nullable="false"/>
                      </column>
                  </createTable>
              </changeSet>

          </databaseChangeLog>
          EOF

      - name: Test with violations
        id: test-violations
        uses: ./
        with:
          directory: test/fixtures/with-violations
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fail-on: never
        continue-on-error: true

      - name: Verify violations were found
        shell: bash
        run: |
          echo "Violations found: ${{ steps.test-violations.outputs.violations-found }}"
          echo "Total: ${{ steps.test-violations.outputs.total-violations }}"
          echo "Critical: ${{ steps.test-violations.outputs.critical-count }}"
          echo "Warning: ${{ steps.test-violations.outputs.warning-count }}"
          echo "Info: ${{ steps.test-violations.outputs.info-count }}"

      - name: Test without violations
        id: test-no-violations
        uses: ./
        with:
          directory: test/fixtures/no-violations
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fail-on: critical

      - name: Verify no violations
        shell: bash
        run: |
          if [ "${{ steps.test-no-violations.outputs.violations-found }}" != "false" ]; then
            echo "Expected no violations"
            exit 1
          fi
