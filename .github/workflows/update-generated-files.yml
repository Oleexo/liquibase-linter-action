name: Update Generated Files
on:
  pull_request:
    paths:
      - src/**
      - package.json
      - pnpm-lock.yaml
      - tsconfig.json
      - biome.json

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
          
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          
      - run: pnpm install --frozen-lockfile
      
      - run: pnpm check
      
      - run: pnpm build
      
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update generated files'
          file_pattern: 'dist/ src/'
