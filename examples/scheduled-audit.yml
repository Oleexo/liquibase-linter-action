name: Scheduled Audit

on:
  # Run weekly audit on Monday at 9 AM
  schedule:
    - cron: '0 9 * * 1'
  
  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  issues: write  # For creating issues

jobs:
  audit:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Full Audit
        id: linter
        uses: n2jsoft-public-org/liquibase-linter-action@v1
        with:
          directory: db/changelog
          severity-threshold: info  # Report everything
          fail-on: never  # Don't fail scheduled jobs
          github-token: ${{ secrets.GITHUB_TOKEN }}
          annotate: 'false'  # Don't create annotations
      
      - name: Generate Report
        run: |
          cat > audit-report.md << EOF
          # Liquibase Audit Report
          
          **Date**: $(date)
          **Branch**: ${{ github.ref_name }}
          
          ## Summary
          
          - Total Violations: ${{ steps.linter.outputs.total-violations }}
          - Critical: ${{ steps.linter.outputs.critical-count }}
          - Warning: ${{ steps.linter.outputs.warning-count }}
          - Info: ${{ steps.linter.outputs.info-count }}
          
          ## Details
          
          See attached JSON file for full details.
          EOF
      
      - name: Upload Audit Results
        uses: actions/upload-artifact@v4
        with:
          name: liquibase-audit-${{ github.run_number }}
          path: |
            audit-report.md
            liquibase-linter-results.json
          retention-days: 90
      
      - name: Create Issue if Critical Issues Found
        if: steps.linter.outputs.critical-count > 0
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Critical Liquibase Violations Found (${new Date().toISOString().split('T')[0]})`,
              body: `### Audit Summary\n\n` +
                    `- **Critical Issues**: ${{ steps.linter.outputs.critical-count }}\n` +
                    `- **Warning Issues**: ${{ steps.linter.outputs.warning-count }}\n` +
                    `- **Info Issues**: ${{ steps.linter.outputs.info-count }}\n\n` +
                    `Please review the [workflow run](${context.payload.repository.html_url}/actions/runs/${context.runId}) for details.`,
              labels: ['security', 'database', 'automated']
            });
